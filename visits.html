<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>訪問記錄 · xiaojian.app</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Microsoft JhengHei",sans-serif;
    background:#0b1c2c;color:#e8f1f8;margin:0;padding:16px;}
  h1{font-size:18px;margin:0 0 4px;}
  .sub{color:#8fa8bd;font-size:12px;margin-bottom:12px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid rgba(255,255,255,.08);}
  th{color:#8fa8bd;font-weight:600;font-size:11px;}
  .err{color:#ff6b6b;}
  button{background:#006b6e;color:#fff;border:0;border-radius:8px;padding:8px 16px;font-size:14px;}
  #gate{position:fixed;inset:0;z-index:9999;background:#0b1c2c;display:flex;align-items:center;justify-content:center;}
  #gate[hidden]{display:none;}
  #gate .gcard{background:#12293d;border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:28px 24px;text-align:center;max-width:300px;}
  #gate input{width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:#0b1c2c;color:#e8f1f8;font-size:16px;margin:12px 0;}
  #gate .gerr{color:#ff6b6b;font-size:13px;min-height:18px;}
</style>
</head>
<body>
<div id="gate" hidden>
  <div class="gcard">
    <div style="font-size:16px;font-weight:700;">訪問記錄</div>
    <div style="color:#8fa8bd;font-size:12px;margin-top:4px;">請輸入密碼</div>
    <input type="password" id="gatePw" placeholder="密碼" autocomplete="off">
    <div class="gerr" id="gateErr"></div>
    <button id="gateGo" style="width:100%;">進入</button>
  </div>
</div>
<div id="main" hidden>
  <h1>訪問記錄</h1>
  <div class="sub">只記時間、瀏覽器、系統，不記 IP · 保留 90 日</div>
  <div id="box">載入中…</div>
</div>
<script>
/* visits 專用密碼門 (同主頁分開) */
(function(){
  var HASH="81ea96707fb0643653507e2ecc9905deeeb7793c8c8df87fc89681d5af356af7";
  var KEY="hkia-visits-auth-v1";
  var gate=document.getElementById("gate"), main=document.getElementById("main");
  try{ if(localStorage.getItem(KEY)==="1"){ main.hidden=false; return; } }catch(e){}
  gate.hidden=false;
  var pw=document.getElementById("gatePw"), err=document.getElementById("gateErr");
  function sha256(s){
    return crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)).then(function(b){
      return Array.from(new Uint8Array(b)).map(function(x){return ("0"+x.toString(16)).slice(-2);}).join("");
    });
  }
  function go(){
    err.textContent="";
    sha256(pw.value).then(function(h){
      if(h===HASH){
        try{ localStorage.setItem(KEY,"1"); }catch(e){}
        gate.hidden=true; main.hidden=false;
      }else{ err.textContent="密碼錯誤"; pw.value=""; pw.focus(); }
    });
  }
  document.getElementById("gateGo").addEventListener("click",go);
  pw.addEventListener("keydown",function(e){ if(e.key==="Enter")go(); });
  setTimeout(function(){ pw.focus(); },300);
})();
</script>
<script>
var TOKEN='lt8ZHWKRVAip4ASDOhZ5Qzgk8I7I-RMl';
var API='https://xiaojian-visit-log.xiaojian-hk.workers.dev/logs?token='+TOKEN;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fmt(iso){
  try{
    var d=new Date(iso);
    var hkt=new Date(d.getTime()+8*3600*1000);
    function p(n){return (n<10?'0':'')+n;}
    return p(hkt.getUTCMonth()+1)+'/'+p(hkt.getUTCDate())+' '+p(hkt.getUTCHours())+':'+p(hkt.getUTCMinutes());
  }catch(e){return iso;}
}
function load(){
  document.getElementById('box').innerHTML='載入中…';
  fetch(API).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(rows){
    if(!rows.length){document.getElementById('box').innerHTML='暫無記錄';return;}
    var h='<div style="color:#8fa8bd;font-size:12px;margin-bottom:8px;">共 '+rows.length+' 條 · 更新於 '+fmt(new Date().toISOString())+'</div>';
    h+='<table><tr><th>時間 (HKT)</th><th>設備</th><th>系統</th><th>瀏覽器</th><th>頁面</th></tr>';
    rows.forEach(function(v){
      h+='<tr><td>'+esc(fmt(v.t))+'</td><td>'+esc((v.device||'—').slice(0,8))+'</td><td>'+esc(v.os)+'</td><td>'+esc(v.browser)+'</td><td>'+esc(v.page)+'</td></tr>';
    });
    document.getElementById('box').innerHTML=h+'</table>';
  }).catch(function(e){
    document.getElementById('box').innerHTML='<span class="err">載入失敗：'+esc(e.message)+'</span> <button onclick="load()">重試</button>';
  });
}
/* 入密碼後自動載入；已登入就即載 */
(function(){
  function tryLoad(){
    if(!document.getElementById('main').hidden) load();
    else setTimeout(tryLoad, 500);
  }
  tryLoad();
})();
</script>
</body>
</html>
