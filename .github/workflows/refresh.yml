name: Refresh flight data

on:
  # 主力係外部 15 分鐘 cron（Muse）。呢度做後備：就算外部 cron 死咗，
  # GitHub Actions 都會每小時補跑一次（queue 可能 delay，但好過冇）。
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest arrival data
        run: python3 scripts/fetch_flights.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data.json data-full.json; then
            echo "No change in data files"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json data-full.json
          git commit -m "Update flight data $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push
