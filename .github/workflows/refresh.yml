name: Refresh flight data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest arrival data
        run: python3 scripts/fetch_flights.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data.json; then
            echo "No change in data.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Update flight data $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push
